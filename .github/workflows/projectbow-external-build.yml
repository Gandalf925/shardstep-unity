name: Build ProjectBow using existing Unity license

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/projectbow-external-build.yml'

permissions:
  contents: read

concurrency:
  group: projectbow-external-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-preflight:
    name: Existing Unity credential preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "$UNITY_LICENSE" ]] || { echo 'UNITY_LICENSE is unavailable.'; missing=1; }
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL is unavailable.'; missing=1; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD is unavailable.'; missing=1; }
          [[ "$missing" -eq 0 ]] || exit 1
          echo 'Existing Unity credential secrets are available.'

  projectbow-webgl:
    name: ProjectBow Unity 2023.2.3f1 WebGL
    needs: credential-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space before ProjectBow checkout
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk usage before cleanup:'
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force || true

          echo 'Disk usage after cleanup:'
          df -h /

      - name: Checkout ProjectBow migration branch with LFS
        uses: actions/checkout@v4
        with:
          repository: Gandalf925/ProjectBow
          ref: webgl-portrait-mobile
          path: projectbow
          fetch-depth: 1
          lfs: true
          clean: true

      - name: Report ProjectBow checkout size
        shell: bash
        run: |
          set -euo pipefail
          du -sh projectbow
          df -h /
          printf 'LFS tracked files: '
          git -C projectbow lfs ls-files | wc -l

      - name: Build ProjectBow portrait WebGL
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: projectbow
          unityVersion: 2023.2.3f1
          targetPlatform: WebGL
          buildMethod: ProjectBowWebGLBuild.BuildFromCommandLine
          versioning: None
          allowDirtyBuild: true

      - name: Verify ProjectBow WebGL output
        shell: bash
        run: |
          set -euo pipefail
          test -f projectbow/Builds/WebGLPortrait/index.html
          test -d projectbow/Builds/WebGLPortrait/Build
          find projectbow/Builds/WebGLPortrait -maxdepth 2 -type f -print | sort
          du -sh projectbow/Builds/WebGLPortrait

      - name: Upload ProjectBow WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectbow-portrait-webgl
          path: projectbow/Builds/WebGLPortrait
          if-no-files-found: error
          retention-days: 14
