name: Build ProjectBow using existing Unity license

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/projectbow-external-build.yml'

permissions:
  contents: read

concurrency:
  group: projectbow-external-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-preflight:
    name: Existing Unity credential preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "$UNITY_LICENSE" ]] || { echo 'UNITY_LICENSE is unavailable.'; missing=1; }
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL is unavailable.'; missing=1; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD is unavailable.'; missing=1; }
          [[ "$missing" -eq 0 ]] || exit 1
          echo 'Existing Unity credential secrets are available.'

  projectbow-webgl:
    name: ProjectBow Unity 2023.2.3f1 WebGL
    needs: credential-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check runner disk capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          available_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [[ "$available_gb" -lt 60 ]]; then
            echo "Only ${available_gb} GiB is available; removing unused SDKs."
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/.ghcup
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            sudo apt-get clean
            docker system prune --all --force >/dev/null 2>&1 || true
            df -h /
          else
            echo "${available_gb} GiB is available; cleanup is unnecessary."
          fi

      - name: Clone ProjectBow history and trees only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projectbow clone-error.log
          if ! GIT_LFS_SKIP_SMUDGE=1 git -c http.version=HTTP/1.1 clone \
              --quiet \
              --filter=blob:none \
              --no-checkout \
              --depth=1 \
              --single-branch \
              --branch=webgl-portrait-mobile \
              https://github.com/Gandalf925/ProjectBow.git \
              projectbow \
              2>clone-error.log; then
            echo 'ProjectBow partial clone failed:'
            tail -n 120 clone-error.log
            exit 1
          fi
          echo 'ProjectBow history/tree clone succeeded.'

      - name: Materialize ProjectBow current Git tree without LFS content
        shell: bash
        run: |
          set -euo pipefail
          rm -f checkout-error.log
          if ! GIT_LFS_SKIP_SMUDGE=1 git -C projectbow checkout \
              --quiet \
              webgl-portrait-mobile \
              2>checkout-error.log; then
            echo 'ProjectBow working-tree checkout failed:'
            tail -n 120 checkout-error.log
            exit 1
          fi
          echo 'ProjectBow Git working tree succeeded.'

      - name: Materialize ProjectBow LFS assets
        shell: bash
        run: |
          set -euo pipefail
          git -C projectbow lfs install --local
          rm -f lfs-error.log
          if ! git -C projectbow lfs pull \
              --include='Assets/**' \
              --exclude='' \
              2>lfs-error.log; then
            echo 'ProjectBow LFS pull failed:'
            tail -n 120 lfs-error.log
            exit 1
          fi
          echo 'ProjectBow LFS pull completed; Unity import is the authoritative asset validation gate.'

      - name: Report ProjectBow checkout size
        shell: bash
        run: |
          set -euo pipefail
          du -sh projectbow
          df -h /
          printf 'LFS tracked files: '
          git -C projectbow lfs ls-files | wc -l

      - name: Build ProjectBow portrait WebGL
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: projectbow
          unityVersion: 2023.2.3f1
          targetPlatform: WebGL
          buildMethod: ProjectBowWebGLBuild.BuildFromCommandLine
          versioning: None
          allowDirtyBuild: true

      - name: Verify ProjectBow WebGL output
        shell: bash
        run: |
          set -euo pipefail
          test -f projectbow/Builds/WebGLPortrait/index.html
          test -d projectbow/Builds/WebGLPortrait/Build
          find projectbow/Builds/WebGLPortrait -maxdepth 2 -type f -print | sort
          du -sh projectbow/Builds/WebGLPortrait

      - name: Upload ProjectBow WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectbow-portrait-webgl
          path: projectbow/Builds/WebGLPortrait
          if-no-files-found: error
          retention-days: 14
