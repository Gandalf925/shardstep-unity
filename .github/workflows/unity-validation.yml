name: SHARDSTEP Development Validation

on:
  push:
    branches:
      - codex/gameplay-polish-batch-1
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: shardstep-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2023.2.22f1-Validation-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-2023.2.22f1-Validation-EditMode-
            Library-2023.2.22f1-

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2023.2.22f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: SHARDSTEP Development EditMode Tests
          artifactsPath: artifacts/tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  webgl-build:
    name: WebGL validation build
    needs: editmode-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force || true
          df -h /

      - name: Cache Unity WebGL Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2023.2.22f1-Validation-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-2023.2.22f1-Validation-WebGL-
            Library-2023.2.22f1-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2023.2.22f1
          targetPlatform: WebGL
          buildMethod: Shardstep.Editor.BuildAutomation.BuildWebGL
          versioning: None
          allowDirtyBuild: true

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: shardstep-webgl-validation
          path: build/WebGL
          if-no-files-found: error
          retention-days: 7
