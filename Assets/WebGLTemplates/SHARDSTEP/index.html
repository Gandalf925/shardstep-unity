<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter,system-ui,sans-serif; background:#05080d; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:#05080d; touch-action:none; }
    body { position:fixed; inset:0; }
    #unity-container { position:fixed; inset:0; overflow:hidden; background:radial-gradient(circle at 50% 28%,#10202c 0%,#05080d 64%); }
    #unity-canvas { display:block; width:100%; height:100%; border:0; outline:0; background:#05080d; touch-action:none; }
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(2,5,9,.92); z-index:10; }
    .panel { width:min(440px,92vw); padding:24px; border:1px solid rgba(72,225,255,.45); border-radius:18px; background:rgba(8,15,23,.96); box-shadow:0 22px 70px rgba(0,0,0,.55); text-align:center; }
    .brand { margin:0 0 8px; font-size:clamp(24px,8vw,42px); letter-spacing:.16em; color:#8ff5ff; }
    .subtitle { margin:0 0 22px; color:#b8c8d4; line-height:1.55; }
    button { width:100%; min-height:58px; border:0; border-radius:13px; font:inherit; font-weight:800; letter-spacing:.08em; color:#031016; background:linear-gradient(135deg,#8ff5ff,#37cce8); cursor:pointer; }
    #loading-overlay,#error-overlay { display:none; }
    #progress-track { height:10px; margin-top:18px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.12); }
    #progress-bar { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#28d4ff,#a86cff); transition:width 120ms linear; }
    #error-message { white-space:pre-wrap; color:#ff9a9a; text-align:left; line-height:1.45; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1" aria-label="{{{ PRODUCT_NAME }}} game canvas"></canvas>
    <div id="launch-overlay" class="overlay"><div class="panel"><h1 class="brand">SHARDSTEP</h1><p class="subtitle">Touch a destination and release to dash. Drag farther to cancel. Use ATTACK to strike in the facing direction.</p><button id="start-button" type="button">TAP TO START</button></div></div>
    <div id="loading-overlay" class="overlay"><div class="panel"><h1 class="brand">SHARDSTEP</h1><p class="subtitle" id="loading-label">LOADING UNITY</p><div id="progress-track"><div id="progress-bar"></div></div></div></div>
    <div id="error-overlay" class="overlay"><div class="panel"><h1 class="brand">LOAD FAILED</h1><p id="error-message"></p></div></div>
  </div>
  <script>
  (function(){
    "use strict";
    var container=document.getElementById("unity-container"),canvas=document.getElementById("unity-canvas"),launchOverlay=document.getElementById("launch-overlay"),loadingOverlay=document.getElementById("loading-overlay"),errorOverlay=document.getElementById("error-overlay"),errorMessage=document.getElementById("error-message"),progressBar=document.getElementById("progress-bar"),loadingLabel=document.getElementById("loading-label"),startButton=document.getElementById("start-button");
    var launchStarted=false,unityInstance=null;
    function resetUnityInput(){ if(!unityInstance||!unityInstance.SendMessage)return; try{unityInstance.SendMessage("SHARDSTEP Runtime","ResetBrowserInput");}catch(e){} }
    function prevent(e){e.preventDefault();}
    ["touchstart","touchmove","touchend","touchcancel"].forEach(function(n){canvas.addEventListener(n,prevent,{passive:false});});
    document.addEventListener("contextmenu",prevent); document.addEventListener("gesturestart",prevent,{passive:false});
    document.addEventListener("visibilitychange",function(){if(document.hidden)resetUnityInput();}); window.addEventListener("blur",resetUnityInput);
    async function requestImmersive(){ if(container.requestFullscreen&&!document.fullscreenElement){try{await container.requestFullscreen({navigationUI:"hide"});}catch(e){try{await container.requestFullscreen();}catch(_){}}} try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("portrait");}catch(e){} }
    function showError(error){loadingOverlay.style.display="none";launchOverlay.style.display="none";errorMessage.textContent=error&&error.message?error.message:String(error);errorOverlay.style.display="flex";}
    async function startUnity(){ if(launchStarted)return; launchStarted=true;startButton.disabled=true;await requestImmersive();launchOverlay.style.display="none";loadingOverlay.style.display="flex";
      var buildUrl="Build",loaderUrl=buildUrl+"/{{{ LOADER_FILENAME }}}",config={dataUrl:buildUrl+"/{{{ DATA_FILENAME }}}",frameworkUrl:buildUrl+"/{{{ FRAMEWORK_FILENAME }}}",codeUrl:buildUrl+"/{{{ CODE_FILENAME }}}",streamingAssetsUrl:"StreamingAssets",companyName:"{{{ COMPANY_NAME }}}",productName:"{{{ PRODUCT_NAME }}}",productVersion:"{{{ PRODUCT_VERSION }}}",devicePixelRatio:Math.min(window.devicePixelRatio||1,2),matchWebGLToCanvasSize:true};
      var script=document.createElement("script");script.src=loaderUrl;script.onload=function(){if(typeof createUnityInstance!=="function"){showError(new Error("Unity WebGL loader did not expose createUnityInstance()."));return;}createUnityInstance(canvas,config,function(progress){var p=Math.round(progress*100);progressBar.style.width=p+"%";loadingLabel.textContent="LOADING UNITY "+p+"%";}).then(function(instance){unityInstance=instance;loadingOverlay.style.display="none";canvas.focus();}).catch(showError);};script.onerror=function(){showError(new Error("Could not load the Unity WebGL loader."));};document.body.appendChild(script);
    }
    startButton.addEventListener("click",startUnity,{once:true});
    if(!(window.matchMedia("(pointer: coarse)").matches||navigator.maxTouchPoints>0))startUnity();
    window.addEventListener("beforeunload",function(){resetUnityInput();if(unityInstance&&unityInstance.Quit)unityInstance.Quit();});
  }());
  </script>
</body>
</html>
